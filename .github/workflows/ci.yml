name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: taskkanban
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Initialize schema and test user
        run: |
          mysql -h 127.0.0.1 -uroot -proot < db/schema.sql
          mysql -h 127.0.0.1 -uroot -proot -e "
            CREATE USER IF NOT EXISTS 'taskkanban'@'%' IDENTIFIED BY 'taskkanban';
            GRANT ALL PRIVILEGES ON taskkanban.* TO 'taskkanban'@'%';
            FLUSH PRIVILEGES;
          "

      - name: Run full test suite
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_USER: taskkanban
          MYSQL_PASSWORD: taskkanban
          MYSQL_DATABASE: taskkanban
        run: pytest -v
