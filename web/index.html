<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TaskKanban 看板</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f7f8fa; }
  h1 { font-size: 22px; }
  table { border-collapse: collapse; width: 100%; background: white; }
  th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; font-size: 14px; }
  th { background: #f0f2f5; }
  .status { font-weight: bold; }
  .status-pending { color: #888; }
  .status-claimed { color: #e67e22; }
  .status-running { color: #2980b9; }
  .status-done { color: #27ae60; }
  .status-failed { color: #e74c3c; }
  .btn { padding: 4px 10px; border: none; border-radius: 4px; cursor: pointer; }
  .btn-report { background: #3498db; color: white; }
  .btn-claim { background: #f39c12; color: white; }
  .hint { color: #666; font-size: 13px; }
</style>
</head>
<body>
<h1>任务状态看板</h1>
<p class="hint">每 2 秒自动刷新</p>

<table id="task-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>状态</th>
      <th>认领者</th>
      <th>创建时间</th>
      <th>操作</th>
    </tr>
  </thead>
  <tbody></tbody>
</table>

<script>
const STATUS_TEXT = {
  pending: '待执行',
  claimed: '已认领',
  running: '执行中',
  done: '完成',
  failed: '失败',
};

async function refresh() {
  try {
    const res = await fetch('/tasks');
    const data = await res.json();
    render(data.tasks || []);
  } catch (err) {
    console.error('刷新失败', err);
  }
}

function render(tasks) {
  const tbody = document.querySelector('#task-table tbody');
  tbody.innerHTML = '';
  for (const task of tasks) {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${task.id}</td>
      <td class="status status-${task.status}">${STATUS_TEXT[task.status] || task.status}</td>
      <td>${task.claimed_by || '-'}</td>
      <td>${task.created_at || '-'}</td>
      <td>
        ${task.status === 'pending' ? `<button class="btn btn-claim" onclick="claimTask(${task.id})">认领</button>` : ''}
        ${task.status === 'claimed' ? `<button class="btn" style="background:#16a085;color:white" onclick="startTask(${task.id})">开始</button>` : ''}
        ${task.status === 'running' ? `<button class="btn btn-report" onclick="reportStep(${task.id})">并发幂等测试</button>` : ''}
        <button class="btn" style="background:#95a5a6;color:white" onclick="showDetail(${task.id})">详情</button>
      </td>
    `;
    tbody.appendChild(tr);
  }
}

async function claimTask(taskId) {
  const res = await fetch(`/tasks/${taskId}/claim`, { method: 'POST' });
  const data = await res.json();
  alert(JSON.stringify(data));
  refresh();
}

async function startTask(taskId) {
  const res = await fetch(`/tasks/${taskId}/start`, { method: 'POST' });
  const data = await res.json();
  alert(JSON.stringify(data));
  refresh();
}

async function reportStep(taskId) {
  // 并发触发 5 次重复完成上报，演示幂等写入。
  // 先读任务详情，用 detail.claimed_by 作为上报所有权 worker_id，
  // 不写死 manual-claim：真实 worker 认领的任务也能从看板按钮做并发演示。
  const detailRes = await fetch(`/tasks/${taskId}`);
  if (!detailRes.ok) { alert('请先查看详情'); return; }
  const detail = await detailRes.json();
  const workerId = detail.claimed_by;
  if (!workerId) { alert('任务尚未被认领，无法上报'); return; }

  const steps = detail.steps || [];
  const notDone = steps.filter(s => s.status === 'pending' || s.status === 'running');
  // 单 Step 任务：第一个请求成功后任务会直接 done，其余请求会 409，体验不好。
  // 优先选“pending 且不是最后一步”的 Step，确保演示完任务仍 running。
  const target = notDone.find(s => s.status === 'pending' && s.step_index !== steps.length)
    || notDone[0];
  if (!target) { alert('所有 Step 都已完成，无法演示首次插入'); return; }
  if (steps.length === 1) {
    alert('单步任务并发演示会产生部分 409，建议使用多步任务。');
    return;
  }

  const stepIndex = target.step_index;
  const requests = Array.from({ length: 5 }, (_, i) =>
    fetch(`/tasks/${taskId}/steps/${stepIndex}/report`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        status: 'success',
        message: `并发第${i + 1}次`,
        worker_id: workerId
      }),
    }).then(res => res.json())
  );
  const results = await Promise.all(requests);
  alert(JSON.stringify(results, null, 2));
  refresh();
}

async function showDetail(taskId) {
  const [taskRes, logsRes] = await Promise.all([
    fetch(`/tasks/${taskId}`),
    fetch(`/tasks/${taskId}/logs`),
  ]);
  if (!taskRes.ok) { alert('任务不存在'); return; }
  const data = await taskRes.json();
  const logsData = logsRes.ok ? await logsRes.json() : { logs: [] };
  const logs = logsData.logs || [];

  const stepLines = data.steps.map(s => {
    const log = logs.find(l => l.step_index === s.step_index);
    const paramText = log ? log.message : '(尚未执行)';
    return `Step${s.step_index} [${s.status}]\n    ${paramText}`;
  }).join('\n');

  alert(`任务 ${taskId} 状态=${data.status}\n\n${stepLines}`);
}

// 定时刷新
setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
